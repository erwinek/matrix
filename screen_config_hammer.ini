# LED Screen Configuration File - Matrix Hammer
# Plik konfiguracyjny dla ekranu LED - Matrix Hammer
#
# Uzycie: ./led-image-viewer --config screen_config_hammer.ini
# Usage:  ./led-image-viewer --config screen_config_hammer.ini
#
# screen_id:
#   1 = 192x192 (3x3)
#   2 = MONSTER 64x512 (8 paneli)  -> screen_config_vertical.ini
#   3 = Matrix Hammer 64x832 (8+5 paneli)

[screen]
screen_id = 3

# 13 paneli 64x64px ulożonych pionowo (od dolu do gory)
# 13 panels 64x64px arranged vertically (from bottom to top)
#
# Calkowita rozdzielczosc: 64px (szer) x 832px (wys)
# Total resolution: 64px (width) x 832px (height)

rows = 64
cols = 64
chain_length = 13
parallel = 1

hardware_mapping = regular
pixel_mapper = V-mapper

# 5 jak na obrazie klienta; dluzszy lancuch niz MONSTER
gpio_slowdown = 5

serial_port = /dev/ttyUSB0
serial_baudrate = 1000000

show_diagnostics = true
